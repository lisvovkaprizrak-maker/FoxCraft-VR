plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Produce the bundled HD glyph PNG during the build, not on Meta Quest.
// Only the rasterized image and font definition ship in the Fabric JAR.
def foxcraftFontDir = layout.buildDirectory.dir('generated/foxcraft-font')
tasks.register('generateFoxcraftHdFont', Exec) {
    inputs.file('tools/GenerateHdFont.java')
    outputs.dir(foxcraftFontDir)
    commandLine System.getProperty('java.home') + '/bin/java',
        '-Djava.awt.headless=true',
        file('tools/GenerateHdFont.java').absolutePath,
        foxcraftFontDir.get().asFile.absolutePath
}
sourceSets.main.resources.srcDir(foxcraftFontDir)
// Gradle 8 validates every consumer of generated resources, including Loom's
// sources JAR; it must wait for the generated texture just like processResources.
tasks.named('sourcesJar') {
    dependsOn tasks.named('generateFoxcraftHdFont')
}

processResources {
    dependsOn tasks.named('generateFoxcraftHdFont')
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
