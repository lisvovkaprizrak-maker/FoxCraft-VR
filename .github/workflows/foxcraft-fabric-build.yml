name: FoxCraft Fabric JAR (Java 21)

on:
  pull_request:
    paths:
      - 'Fabric/foxchatkeyboard/**'
      - '.github/workflows/foxcraft-fabric-build.yml'
  push:
    branches: [master]
    paths:
      - 'Fabric/foxchatkeyboard/**'
      - '.github/workflows/foxcraft-fabric-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Fabric client bridge
        run: bash Fabric/foxchatkeyboard/build.sh
      - name: Run simulated Minecraft chat tests
        run: bash Fabric/foxchatkeyboard/tests/run-tests.sh
      - name: Validate Fabric metadata and package contents
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          path = Path("Fabric/foxchatkeyboard/FoxChatKeyboard-bridge-0.6.1-fabric-1.21.5.jar")
          with zipfile.ZipFile(path) as jar:
              names = set(jar.namelist())
              data = json.loads(jar.read("fabric.mod.json"))
              assert data["id"] == "questchatkeyboardbridge"
              assert data["version"] == "0.6.1"
              assert data["depends"]["minecraft"] == "1.21.5"
              assert "com/questchatkeyboard/bridge/QuestChatKeyboardBridge.class" in names
              assert not any(name.startswith("net/fabricmc/") for name in names)
          print("JAR validated:", path, path.stat().st_size, "bytes")
          PY
      - name: Confirm JAR declares Minecraft 1.21.5
        run: python3 tools/foxcraft_check_fabric_compat.py Fabric/foxchatkeyboard/FoxChatKeyboard-bridge-0.6.1-fabric-1.21.5.jar --minecraft 1.21.5
      - name: Stage JAR into Unity StreamingAssets
        run: |
          python3 tools/foxcraft_stage_fabric.py
          test -s Assets/StreamingAssets/FoxChatKeyboard-bridge-0.6.1.jar
      - name: Upload compiled Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: FoxChatKeyboard-Fabric-0.6.1-1.21.5
          path: Fabric/foxchatkeyboard/FoxChatKeyboard-bridge-0.6.1-fabric-1.21.5.jar
          if-no-files-found: error
          retention-days: 14
